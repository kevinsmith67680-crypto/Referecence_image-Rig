name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 runners are Apple Silicon (M1), like the target Mac.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cloud test suite (native Moho tests are skipped = NOT EXECUTED)
        run: python -m pytest -v
      - name: Installer script dry run (bash 3.2 on macOS)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Fake Custom Content"
          PYTHON=python tools/macos/install_phase0.sh --custom-content "$RUNNER_TEMP/Fake Custom Content"
          test -f "$RUNNER_TEMP/Fake Custom Content/Scripts/Menu/AutoRig/AutoRig_Phase0_Build.lua"
          test -f "$RUNNER_TEMP/Fake Custom Content/Scripts/Menu/AutoRig/AutoRig_Probe.lua"
